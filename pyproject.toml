[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sash-vlm-safety-audit"
version = "0.1.0"
description = "Risk-controlled audit of domain fine-tuning for assistive VQA"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Pratik Daithankar" }]
dependencies = [
  "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "num2words==0.5.14",
    "pandas>=2.2,<3",
  "pillow>=11,<13",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
model = [
    "accelerate==1.12.0",
    "backoff==2.2.1",
    "datasets==4.8.3",
    "huggingface-hub==0.36.0",
    "peft==0.20.0",
    "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.57.6",
]
modal = ["modal==1.3.5"]
tracking = ["wandb==0.28.1"]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
sash-audit = "sash_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sash_audit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
